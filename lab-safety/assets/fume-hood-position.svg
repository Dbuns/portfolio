<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-labelledby="title"><title id="title">Fume hood working position</title><rect width="900" height="550" rx="12" fill="#edf3ed"/><g stroke="#133039" stroke-width="5" fill="none"><path d="M400 110H800V470H400V330H800M440 110V265"/><circle cx="280" cy="220" r="36"/><path d="M260 257L240 360L220 470M240 360L310 470M255 290L355 330L535 330"/><path d="M580 295V320H650V270H580V295"/></g><path d="M403 110V265" stroke="#006a60" stroke-width="14"/><path d="M380 90V475" stroke="#b77624" stroke-width="2" stroke-dasharray="7 6"/><g font-family="Arial,sans-serif" fill="#133039" font-size="22"><text x="30" y="45" font-size="30" font-weight="bold">Keep your head outside. Work inside the protected zone.</text><text x="35" y="155">Head and torso</text><text x="35" y="182">outside the opening</text><text x="465" y="80">Sash at its marked operating position</text><text x="475" y="375">Apparatus at least 15 cm back</text><text x="475" y="405">Keep airflow openings clear</text><text x="35" y="515">Check the airflow indicator. Follow the markings and instructions on your hood.</text></g><g stroke="#006a60" stroke-width="3"><path d="M180 185L240 210M460 86L410 150M405 345H555"/></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="t d"><title id="t">Containment and clean contact during chemical transport</title><desc id="d">A closed labelled bottle sits in a carrier. A separate door handle is identified as a clean shared surface. A planned route connects them.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#006a60"/></marker></defs><rect width="800" height="410" rx="12" fill="#eef4ef"/><g font-family="Arial,sans-serif" fill="#133039"><text x="26" y="38" font-size="24" font-weight="bold">Contain the chemical. Keep shared contact clean.</text><rect x="80" y="155" width="105" height="125" rx="12" fill="white" stroke="#52666b" stroke-width="4"/><path d="M115 155V123H150V155" fill="white" stroke="#52666b" stroke-width="4"/><rect x="110" y="108" width="46" height="17" rx="3" fill="#006a60"/><rect x="96" y="188" width="73" height="53" fill="#f1e8cf"/><text x="104" y="220" font-size="16">LABEL</text><path d="M45 241V300H220V241" fill="#c2dce3" fill-opacity=".45" stroke="#52666b" stroke-width="6"/><text x="35" y="337" font-size="17">Approved carrier or</text><text x="35" y="361" font-size="17">secondary containment</text><path d="M260 212H488" stroke="#006a60" stroke-width="5" marker-end="url(#a)"/><text x="275" y="177" font-size="17">Plan the route</text><text x="275" y="247" font-size="17">Keep a secure grip</text><rect x="560" y="85" width="180" height="240" rx="3" fill="white" stroke="#52666b" stroke-width="4"/><circle cx="604" cy="210" r="15" fill="#006a60"/><rect x="604" y="204" width="77" height="12" rx="6" fill="#006a60"/><text x="535" y="353" font-size="17">Clean door contact</text><text x="26" y="391" font-size="14">Use the local transport method; never contaminate a shared handle with potentially contaminated gloves.</text></g></svg>

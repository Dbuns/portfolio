<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 424" role="img" aria-labelledby="title desc"><title id="title">Use the SDS to answer practical questions</title><desc id="desc">The SDS supports a task assessment; it is not a complete work procedure.</desc><rect width="740" height="424" rx="12" fill="#eef4ef"/><g font-family="Arial,sans-serif" fill="#133039"><text x="24" y="40" font-size="24" font-weight="bold">Use the SDS to answer practical questions</text><circle cx="42" cy="98" r="19" fill="#006a60"/><text x="42" y="104" text-anchor="middle" fill="white" font-size="18">1</text><text x="78" y="93" font-size="20" font-weight="bold">2 · Hazards</text><text x="78" y="121" font-size="16" fill="#52666b">What can cause harm?</text><circle cx="42" cy="174" r="19" fill="#006a60"/><text x="42" y="180" text-anchor="middle" fill="white" font-size="18">2</text><text x="78" y="169" font-size="20" font-weight="bold">4 and 6 · Exposure and release</text><text x="78" y="197" font-size="16" fill="#52666b">What emergency information supports the local procedure?</text><circle cx="42" cy="250" r="19" fill="#006a60"/><text x="42" y="256" text-anchor="middle" fill="white" font-size="18">3</text><text x="78" y="245" font-size="20" font-weight="bold">7 and 10 · Handling and compatibility</text><text x="78" y="273" font-size="16" fill="#52666b">What conditions or materials must be avoided?</text><circle cx="42" cy="326" r="19" fill="#006a60"/><text x="42" y="332" text-anchor="middle" fill="white" font-size="18">4</text><text x="78" y="321" font-size="20" font-weight="bold">8 · Controls and protection</text><text x="78" y="349" font-size="16" fill="#52666b">What ventilation and protective equipment are needed?</text><text x="24" y="406" font-size="13" fill="#52666b">The SDS supports a task assessment; it is not a complete work procedure.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-labelledby="t d"><title id="t">Fume hood controls and airflow</title><desc id="d">A schematic fume hood with an operating indicator, lowered sash, inward airflow and a container on the work surface. Follow local operating instructions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#006a60"/></marker></defs><rect width="800" height="490" rx="12" fill="#eef4ef"/><g font-family="Arial,sans-serif" fill="#133039"><text x="26" y="38" font-size="24" font-weight="bold">A functioning hood controls airborne exposure</text><rect x="205" y="85" width="310" height="310" rx="4" fill="white" stroke="#52666b" stroke-width="5"/><rect x="218" y="96" width="284" height="47" fill="#d9e5dc"/><rect x="220" y="152" width="279" height="160" fill="#c2dce3" fill-opacity=".5" stroke="#52666b" stroke-width="3"/><path d="M220 310H500" stroke="#133039" stroke-width="7"/><rect x="195" y="386" width="330" height="15" fill="#52666b"/><path d="M225 410V450M500 410V450" stroke="#52666b" stroke-width="6"/><rect x="450" y="105" width="35" height="22" rx="3" fill="#006a60"/><text x="280" y="276" font-size="18">Sash / barrier</text><rect x="360" y="330" width="35" height="55" fill="#f1e8cf" stroke="#52666b" stroke-width="3"/><path d="M368 330V318H388V330" fill="none" stroke="#52666b" stroke-width="3"/><path d="M285 346H333M285 370H333" stroke="#006a60" stroke-width="4" marker-end="url(#arrow)"/><path d="M411 364V170M430 364V170" stroke="#006a60" stroke-width="4" marker-end="url(#arrow)"/><text x="26" y="348" font-size="17">Air enters</text><text x="26" y="372" font-size="17">the opening</text><path d="M133 358H280" stroke="#006a60" stroke-width="3" marker-end="url(#arrow)"/><text x="552" y="106" font-size="17">Check indicator</text><path d="M545 113H490" stroke="#52666b" stroke-width="2"/><text x="552" y="222" font-size="17">Use the specified</text><text x="552" y="245" font-size="17">sash position</text><path d="M545 236H505" stroke="#52666b" stroke-width="2"/><text x="552" y="348" font-size="17">Keep airflow clear</text><text x="552" y="372" font-size="17">and your face outside</text><text x="26" y="472" font-size="14">Schematic only. Follow the hood's instructions; a hood is not a storage cupboard or explosion shield.</text></g></svg>

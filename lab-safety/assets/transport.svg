<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 424" role="img" aria-labelledby="title desc"><title id="title">A safe transfer includes the whole route</title><desc id="desc">One clean hand is a local method, not a universal transport rule.</desc><rect width="740" height="424" rx="12" fill="#eef4ef"/><g font-family="Arial,sans-serif" fill="#133039"><text x="24" y="40" font-size="24" font-weight="bold">A safe transfer includes the whole route</text><circle cx="42" cy="98" r="19" fill="#006a60"/><text x="42" y="104" text-anchor="middle" fill="white" font-size="18">1</text><text x="78" y="93" font-size="20" font-weight="bold">Contain the chemical</text><text x="78" y="121" font-size="16" fill="#52666b">Closed, labeled container in suitable secondary containment.</text><circle cx="42" cy="174" r="19" fill="#006a60"/><text x="42" y="180" text-anchor="middle" fill="white" font-size="18">2</text><text x="78" y="169" font-size="20" font-weight="bold">Keep a secure grip</text><text x="78" y="197" font-size="16" fill="#52666b">Use the approved carrier or assistance.</text><circle cx="42" cy="250" r="19" fill="#006a60"/><text x="42" y="256" text-anchor="middle" fill="white" font-size="18">3</text><text x="78" y="245" font-size="20" font-weight="bold">Keep shared surfaces clean</text><text x="78" y="273" font-size="16" fill="#52666b">Avoid touching doors with contaminated gloves.</text><circle cx="42" cy="326" r="19" fill="#006a60"/><text x="42" y="332" text-anchor="middle" fill="white" font-size="18">4</text><text x="78" y="321" font-size="20" font-weight="bold">Follow the local method</text><text x="78" y="349" font-size="16" fill="#52666b">Arrange clean door contact without compromising protection.</text><text x="24" y="406" font-size="13" fill="#52666b">One clean hand is a local method, not a universal transport rule.</text></g></svg>
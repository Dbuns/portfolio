<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 500" role="img" aria-labelledby="title desc"><title id="title">Prefer controls that act on the hazard</title><desc id="desc">Original diagram based on CDC/NIOSH hierarchy of controls.</desc><rect width="740" height="500" rx="12" fill="#eef4ef"/><g font-family="Arial,sans-serif" fill="#133039"><text x="24" y="40" font-size="24" font-weight="bold">Prefer controls that act on the hazard</text><circle cx="42" cy="98" r="19" fill="#006a60"/><text x="42" y="104" text-anchor="middle" fill="white" font-size="18">1</text><text x="78" y="93" font-size="20" font-weight="bold">Elimination</text><text x="78" y="121" font-size="16" fill="#52666b">Remove the hazard from the task.</text><circle cx="42" cy="174" r="19" fill="#006a60"/><text x="42" y="180" text-anchor="middle" fill="white" font-size="18">2</text><text x="78" y="169" font-size="20" font-weight="bold">Substitution</text><text x="78" y="197" font-size="16" fill="#52666b">Use a safer alternative after reviewing its risks.</text><circle cx="42" cy="250" r="19" fill="#006a60"/><text x="42" y="256" text-anchor="middle" fill="white" font-size="18">3</text><text x="78" y="245" font-size="20" font-weight="bold">Engineering controls</text><text x="78" y="273" font-size="16" fill="#52666b">Enclosure, ventilation and physical barriers.</text><circle cx="42" cy="326" r="19" fill="#006a60"/><text x="42" y="332" text-anchor="middle" fill="white" font-size="18">4</text><text x="78" y="321" font-size="20" font-weight="bold">Administrative controls</text><text x="78" y="349" font-size="16" fill="#52666b">Procedures, training, access and supervision.</text><circle cx="42" cy="402" r="19" fill="#006a60"/><text x="42" y="408" text-anchor="middle" fill="white" font-size="18">5</text><text x="78" y="397" font-size="20" font-weight="bold">PPE</text><text x="78" y="425" font-size="16" fill="#52666b">Task-appropriate protection adds a personal barrier.</text><text x="24" y="482" font-size="13" fill="#52666b">Original diagram based on CDC/NIOSH hierarchy of controls.</text></g></svg>
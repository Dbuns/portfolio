<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 424" role="img" aria-labelledby="title desc"><title id="title">How a chemical can reach the body</title><desc id="desc">A chemical can be hazardous without a warning smell or immediate pain.</desc><rect width="740" height="424" rx="12" fill="#eef4ef"/><g font-family="Arial,sans-serif" fill="#133039"><text x="24" y="40" font-size="24" font-weight="bold">How a chemical can reach the body</text><circle cx="42" cy="98" r="19" fill="#006a60"/><text x="42" y="104" text-anchor="middle" fill="white" font-size="18">1</text><text x="78" y="93" font-size="20" font-weight="bold">Inhalation</text><text x="78" y="121" font-size="16" fill="#52666b">Breathing gases, vapors, aerosols or dust.</text><circle cx="42" cy="174" r="19" fill="#006a60"/><text x="42" y="180" text-anchor="middle" fill="white" font-size="18">2</text><text x="78" y="169" font-size="20" font-weight="bold">Skin and eyes</text><text x="78" y="197" font-size="16" fill="#52666b">Splashes, contact and possible absorption through skin.</text><circle cx="42" cy="250" r="19" fill="#006a60"/><text x="42" y="256" text-anchor="middle" fill="white" font-size="18">3</text><text x="78" y="245" font-size="20" font-weight="bold">Ingestion</text><text x="78" y="273" font-size="16" fill="#52666b">Contaminated hands, food or objects reaching the mouth.</text><circle cx="42" cy="326" r="19" fill="#006a60"/><text x="42" y="332" text-anchor="middle" fill="white" font-size="18">4</text><text x="78" y="321" font-size="20" font-weight="bold">Puncture</text><text x="78" y="349" font-size="16" fill="#52666b">A contaminated sharp object breaks the skin.</text><text x="24" y="406" font-size="13" fill="#52666b">A chemical can be hazardous without a warning smell or immediate pain.</text></g></svg>